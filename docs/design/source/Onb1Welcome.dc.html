<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — 1 Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Geist+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#000;text-decoration:none}
button{font-family:inherit}
.orb{background:radial-gradient(circle at 32% 26%,#fff1e8 0%,rgba(255,241,232,0) 30%),radial-gradient(circle at 74% 70%,#0447ff 0%,rgba(4,71,255,0) 58%),radial-gradient(circle at 20% 80%,#ff4704 0%,rgba(255,71,4,0) 55%),radial-gradient(circle at 72% 20%,#f4a6c8 0%,rgba(244,166,200,0) 50%),#d8c8f0}
.breathe{animation:breathe 3.6s ease-in-out infinite}
.halo{animation:halo 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes halo{0%,100%{transform:scale(1);opacity:.32}50%{transform:scale(1.16);opacity:.1}}
@media (prefers-reduced-motion: reduce){.breathe,.halo{animation:none}}
.btn-primary:hover{background:#262422}
.btn-text:hover{background:#f5f3f1}
</style>
</helmet>
<div data-name="Onboarding / 1 Welcome" style="width: 1280px; height: 800px; background: #fdfcfc; color: #000; font-family: Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif; font-size: 14px; letter-spacing: 0.01em; display: flex; flex-direction: column; padding: 32px 48px 40px">

  <header data-name="Onboarding / 1 Welcome / Top bar" style="height: 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
    <div data-name="Onboarding / Wordmark" style="display: flex; align-items: center; gap: 8px">
      <span class="orb" aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9999px"></span>
      <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em">Murmur</span>
    </div>
    <div data-name="Onboarding / Step indicator" role="group" aria-label="Step 1 of 5" style="display: flex; align-items: center; gap: 14px">
      <span data-name="Onboarding / Step indicator / Label" style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #777169">1 / 5</span>
      <div data-name="Onboarding / Progress segments" aria-hidden="true" style="display: flex; gap: 6px">
        <span data-name="Progress segment – current" style="width: 32px; height: 3px; border-radius: 9999px; background: #000"></span>
        <span data-name="Progress segment – upcoming" style="width: 32px; height: 3px; border-radius: 9999px; background: #ebe8e4"></span>
        <span data-name="Progress segment – upcoming" style="width: 32px; height: 3px; border-radius: 9999px; background: #ebe8e4"></span>
        <span data-name="Progress segment – upcoming" style="width: 32px; height: 3px; border-radius: 9999px; background: #ebe8e4"></span>
        <span data-name="Progress segment – upcoming" style="width: 32px; height: 3px; border-radius: 9999px; background: #ebe8e4"></span>
      </div>
    </div>
    <div></div>
  </header>

  <main data-name="Onboarding / 1 Welcome / Content" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; text-align: center">
    <div data-name="Onboarding / 1 Welcome / Recording orb" style="position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center">
      <div class="orb halo" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 9999px; filter: blur(30px)"></div>
      <div class="orb breathe" role="img" aria-label="Murmur recording orb" style="position: relative; width: 232px; height: 232px; border-radius: 9999px; box-shadow: inset 0 0 40px rgba(255,255,255,0.35)"></div>
    </div>
    <div data-name="Onboarding / 1 Welcome / Text" style="display: flex; flex-direction: column; gap: 14px; align-items: center">
      <h1 data-name="Onboarding / 1 Welcome / Headline" style="margin: 0; font-size: 48px; font-weight: 300; line-height: 1.08; letter-spacing: -0.02em">Record and transcribe your meetings.</h1>
      <p data-name="Onboarding / 1 Welcome / Subline" style="margin: 0; font-size: 16px; line-height: 1.5; color: #777169">Everything stays on your computer.</p>
    </div>
  </main>

  <footer data-name="Onboarding / 1 Welcome / Bottom bar" style="height: 48px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 4px">
      <a href="Onb5FirstRecording.dc.html" data-name="Onboarding / Button / Text – Skip" class="btn-text" style="height: 44px; padding: 0 16px; border-radius: 9999px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #777169">Skip</a>
    </div>
    <a href="Onb2Audio.dc.html" data-name="Onboarding / Button / Primary – Get started" class="btn-primary" style="height: 44px; padding: 0 24px; border-radius: 9999px; background: #000; color: #fff; display: flex; align-items: center; font-size: 14px; font-weight: 500">Get started</a>
  </footer>
</div>
</x-dc>

</body>
</html>
