<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Idea 5 — Activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Geist+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
.orb{background:radial-gradient(circle at 32% 26%,#fff1e8 0%,rgba(255,241,232,0) 30%),radial-gradient(circle at 74% 70%,#0447ff 0%,rgba(4,71,255,0) 58%),radial-gradient(circle at 20% 80%,#ff4704 0%,rgba(255,71,4,0) 55%),radial-gradient(circle at 72% 20%,#f4a6c8 0%,rgba(244,166,200,0) 50%),#d8c8f0}
.spin{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.sb:hover{background:#f5f3f1!important}
</style>
</helmet>
<div data-name="Idea 5 / Activity" style="width: 1100px; height: 720px; overflow: hidden; background: #fdfcfc; font-family: Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif; font-size: 13px; letter-spacing: 0.01em; color: #000; display: flex">

  <nav aria-hidden="true" data-name="Context / Sidebar" style="width: 200px; flex: none; padding: 14px 12px; border-right: 1px solid #ebe8e4; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px"><span class="orb" style="width: 18px; height: 18px; border-radius: 9999px"></span><span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em">Murmur</span></div>
    <div style="height: 32px; border-radius: 9999px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 500">New recording</div>
    <div style="display: flex; flex-direction: column; gap: 2px; color: #44403b">
      <div style="height: 32px; padding: 0 10px; border-radius: 9999px; background: #f5f3f1; color: #000; font-weight: 500; display: flex; align-items: center">Library</div>
      <div style="height: 32px; padding: 0 10px; display: flex; align-items: center">Ask AI</div>
      <div style="height: 32px; padding: 0 10px; display: flex; align-items: center">Settings</div>
    </div>
  </nav>

  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative">
    <main aria-hidden="true" data-name="Context / Library" style="flex: 1; min-height: 0; padding: 56px 40px 0; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
      <div style="font-size: 24px; font-weight: 300; letter-spacing: -0.02em">What are we recording today?</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><div style="height: 160px; border-radius: 20px; background: #f5f3f1"></div><div style="height: 160px; border-radius: 20px; background: #f5f3f1"></div></div>
      <div style="border: 1px solid #ebe8e4; border-radius: 16px; overflow: hidden"><div style="height: 56px; border-bottom: 1px solid #ebe8e4"></div><div style="height: 56px; border-bottom: 1px solid #ebe8e4"></div><div style="height: 56px"></div></div>
    </main>

    <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
      <div role="dialog" aria-label="Activity" data-name="Idea 5 / Activity popover" style="position: absolute; right: 12px; bottom: 36px; width: 320px; padding: 6px; border-radius: 16px; background: #fdfcfc; box-shadow: rgba(0,0,0,0.14) 0 14px 36px, rgba(0,0,0,0.3) 0 0 1px; display: flex; flex-direction: column">
        <div style="padding: 6px 8px 4px; display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 13px; font-weight: 500">Activity</span><span style="font-size: 11px; color: #777169">All on this PC</span></div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px">
          <span class="orb spin" aria-hidden="true" style="width: 12px; height: 12px; flex: none; border-radius: 9999px; margin: 0 4px"></span>
          <span style="flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 500">Recording</span> · Untitled recording</span>
          <span class="mono" style="font-size: 11px; color: #44403b">12:48</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px">
          <svg width="20" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px"><span style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 500">Transcribing</span> · Weekly team sync</span><span aria-hidden="true" style="display: block; height: 3px; border-radius: 9999px; background: #ebe8e4; overflow: hidden"><span style="display: block; width: 64%; height: 100%; background: #000"></span></span></span>
          <span class="mono" style="font-size: 11px; color: #44403b">64%</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px">
          <svg width="20" height="14" viewBox="0 0 24 24" fill="none" stroke="#777169" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
          <span style="flex: 1; min-width: 0; font-size: 12px; color: #44403b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Index + summary · after transcription</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px">
          <svg width="20" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px"><span style="font-size: 12px"><span style="font-weight: 500">Downloading</span> · Gemma 4 26B</span><span aria-hidden="true" style="display: block; height: 3px; border-radius: 9999px; background: #ebe8e4; overflow: hidden"><span style="display: block; width: 42%; height: 100%; background: #000"></span></span></span>
          <span class="mono" style="font-size: 11px; color: #44403b">42%</span>
        </div>
      </div>
    </sc-if>

    <footer data-name="Idea 5 / Status bar" style="height: 28px; flex: none; padding: 0 10px; border-top: 1px solid #ebe8e4; background: #fdfcfc; display: flex; align-items: center; gap: 4px; font-size: 11px; color: #44403b">
      <span class="sb" style="height: 22px; padding: 0 7px; border-radius: 6px; display: flex; align-items: center; gap: 6px"><span class="orb spin" aria-hidden="true" style="width: 8px; height: 8px; border-radius: 9999px"></span>Recording <span class="mono">12:48</span></span>
      <button type="button" onClick="{{toggle}}" aria-expanded="{{open}}" class="sb" style="height: 22px; padding: 0 7px; border-radius: 6px; border: 0; background: {{btnBg}}; color: #000; display: flex; align-items: center; gap: 5px; font-size: 11px">Transcribing <span class="mono">64%</span> · Downloading <span class="mono">42%</span></button>
      <span style="margin-left: auto; display: flex; align-items: center; gap: 5px; color: #777169"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>All local</span>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true };
  }
  renderVals() {
    var self = this;
    return {
      open: this.state.open,
      btnBg: this.state.open ? '#ebe8e4' : 'transparent',
      toggle: () => self.setState({ open: !self.state.open })
    };
  }
}
</script>
</body>
</html>
