<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Idea 6 — Export and share</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Geist+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.soft:hover{background:#f5f3f1!important}
.opt:hover{background:#f5f3f1}
</style>
</helmet>
<div data-name="Idea 6 / Export and share" style="width: 1100px; height: 720px; position: relative; overflow: hidden; background: #fdfcfc; font-family: Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif; font-size: 13px; letter-spacing: 0.01em; color: #000">

  <div aria-hidden="true" data-name="Context / Recording details" style="position: absolute; inset: 0; padding: 14px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="font-size: 13px; color: #777169">Library / <span style="color: #000">Client demo — Q4 roadmap</span></div>
    <div style="font-size: 24px; font-weight: 300; letter-spacing: -0.02em">Client demo — Q4 roadmap</div>
    <div style="display: flex; gap: 16px; flex: 1">
      <div style="width: 420px; display: flex; flex-direction: column; gap: 12px"><div style="height: 236px; border-radius: 16px; background: #f5f3f1"></div><div style="height: 110px; border-radius: 16px; border: 1px solid #ebe8e4"></div></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 10px"><div style="height: 56px; border-radius: 12px; background: #f5f3f1"></div><div style="height: 56px"></div><div style="height: 56px"></div><div style="height: 56px"></div></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,19,18,0.32)"></div>

  <div role="dialog" aria-label="Export recording" data-name="Idea 6 / Export sheet" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 840px; height: 540px; border-radius: 20px; background: #fdfcfc; box-shadow: rgba(0,0,0,0.3) 0 20px 56px; display: flex; flex-direction: column; overflow: hidden">
    <header style="height: 52px; flex: none; padding: 0 14px 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ebe8e4">
      <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 18px; font-weight: 300; letter-spacing: -0.02em">Export</span><span style="font-size: 12px; color: #777169">Client demo — Q4 roadmap</span></div>
      <button type="button" aria-label="Close" class="soft" style="width: 30px; height: 30px; border-radius: 9999px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>

    <div style="flex: 1; min-height: 0; display: flex">
      <div data-name="Export / Options" style="width: 300px; flex: none; padding: 16px 20px; border-right: 1px solid #ebe8e4; display: flex; flex-direction: column; gap: 16px; overflow-y: auto">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; font-weight: 500">Format</span>
          <div role="radiogroup" aria-label="Format" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{formats}}" as="f" hint-placeholder-count="4">
              <button type="button" role="radio" aria-checked="{{f.on}}" onClick="{{f.pick}}" class="opt" style="height: 48px; padding: 0 12px; border-radius: 12px; border: {{f.bd}}; background: #fdfcfc; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 1px"><span style="font-size: 13px; font-weight: 500">{{f.label}}</span><span class="mono" style="font-size: 11px; color: #777169">{{f.ext}}</span></button>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 500; margin-bottom: 4px">Include</span>
          <sc-for list="{{includes}}" as="o" hint-placeholder-count="4">
            <button type="button" role="checkbox" aria-checked="{{o.on}}" disabled="{{o.disabled}}" onClick="{{o.toggle}}" class="opt" style="height: 32px; padding: 0 6px; margin: 0 -6px; border-radius: 8px; border: 0; background: transparent; display: flex; align-items: center; gap: 10px; opacity: {{o.op}}; text-align: left">
              <span aria-hidden="true" style="width: 16px; height: 16px; flex: none; border-radius: 4px; border: {{o.bd}}; background: {{o.bg}}; color: #fff; display: flex; align-items: center; justify-content: center"><sc-if value="{{o.on}}" hint-placeholder-val="{{ true }}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></sc-if></span>
              <span style="font-size: 13px">{{o.label}}</span>
            </button>
          </sc-for>
          <sc-if value="{{isSrt}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #777169; padding-top: 4px">Subtitles carry only the spoken lines.</span></sc-if>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 500">Range</span>
          <div role="radiogroup" aria-label="Range" style="display: flex; flex-direction: column; gap: 2px">
            <sc-for list="{{ranges}}" as="r" hint-placeholder-count="2">
              <button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" class="opt" style="height: 32px; padding: 0 6px; margin: 0 -6px; border-radius: 8px; border: 0; background: transparent; display: flex; align-items: center; gap: 10px; text-align: left">
                <span aria-hidden="true" style="width: 16px; height: 16px; flex: none; border-radius: 9999px; border: {{r.ring}}; display: flex; align-items: center; justify-content: center"><sc-if value="{{r.on}}" hint-placeholder-val="{{ false }}"><span style="width: 7px; height: 7px; border-radius: 9999px; background: #000"></span></sc-if></span>
                <span style="font-size: 13px">{{r.label}}</span>
                <span class="mono" style="margin-left: auto; font-size: 11px; color: #777169">{{r.span}}</span>
              </button>
            </sc-for>
          </div>
        </div>
      </div>

      <div data-name="Export / Preview" style="flex: 1; min-width: 0; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 12px; font-weight: 500">Preview</span><span class="mono" style="font-size: 11px; color: #777169">{{fileName}}</span></div>
        <pre style="flex: 1; min-height: 0; margin: 0; padding: 14px 16px; border-radius: 12px; background: #f5f3f1; overflow: auto; white-space: pre-wrap; word-break: break-word; font-family: {{previewFont}}; font-size: {{previewSize}}; line-height: 1.6; color: #000">{{preview}}</pre>
      </div>
    </div>

    <footer style="height: 56px; flex: none; padding: 0 14px 0 20px; border-top: 1px solid #ebe8e4; display: flex; align-items: center; gap: 8px">
      <span role="status" style="font-size: 12px; color: #44403b">{{status}}</span>
      <button type="button" onClick="{{copy}}" disabled="{{copyDisabled}}" class="soft" style="margin-left: auto; height: 32px; padding: 0 14px; border-radius: 9999px; border: 1px solid #e5e5e5; background: #fdfcfc; color: {{copyFg}}; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Copy</button>
      <button type="button" onClick="{{save}}" style="height: 32px; padding: 0 16px; border-radius: 9999px; border: 0; background: #000; color: #fff; font-size: 13px; font-weight: 500">{{saveLabel}}</button>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { format: 'md', summary: true, actions: true, times: true, speakers: true, range: 'all', status: '' };
    this.segs = [
      { sp: 'You', t: 712, text: 'Okay, a quick run through the roadmap. Recording and transcription are stable, and we’re finishing library search now.' },
      { sp: 'Others', t: 728, text: 'Does search only match exact words, or can I ask in my own words?' },
      { sp: 'You', t: 741, text: 'Both: full-text plus semantic. Answers come back with timestamps, so one click takes you to the exact moment.' },
      { sp: 'Others', t: 760, text: 'Great. What about PDF export? We need it for our reports.' },
      { sp: 'You', t: 772, text: 'PDF export moves to next sprint — first we finish meeting summaries and action items.' },
      { sp: 'Others', t: 795, text: 'Okay, then let’s lock in the demo for next week.' },
      { sp: 'You', t: 804, text: 'Deal. I’ll send the invite today.' }
    ];
    this.summary = 'Walked the client through the roadmap: recording and transcription are ready, library search is in progress. PDF export moved to next sprint; the demo is set for next week.';
    this.actions = [{ text: 'Send the demo invite', t: 804 }, { text: 'Add PDF export to the sprint plan', t: 772 }];
  }
  pad(n) { return n < 10 ? '0' + n : '' + n; }
  mmss(t) { return this.pad(Math.floor(t / 60)) + ':' + this.pad(t % 60); }
  srtTime(t) { return '00:' + this.pad(Math.floor(t / 60)) + ':' + this.pad(t % 60) + ',000'; }
  build() {
    var s = this.state, self = this;
    var segs = s.range === 'all' ? this.segs : this.segs.filter((g) => g.t >= 735);
    if (s.format === 'srt') {
      return segs.map((g, i) => {
        var end = i + 1 < segs.length ? segs[i + 1].t : g.t + 8;
        return (i + 1) + '\n' + self.srtTime(g.t) + ' --> ' + self.srtTime(end) + '\n' + (s.speakers ? g.sp + ': ' : '') + g.text;
      }).join('\n\n');
    }
    var md = s.format === 'md';
    var out = [];
    out.push(md ? '# Client demo — Q4 roadmap' : 'Client demo — Q4 roadmap');
    out.push('Today, 10:30 · 47:12 · English' + (s.range === 'all' ? '' : ' · Chapter: PDF export'));
    if (s.summary) { out.push(''); out.push(md ? '## Summary' : 'SUMMARY'); out.push(this.summary); }
    if (s.actions) {
      out.push(''); out.push(md ? '## Action items' : 'ACTION ITEMS');
      this.actions.forEach((a) => out.push((md ? '- [ ] ' : '• ') + a.text + (s.times ? ' (' + self.mmss(a.t) + ')' : '')));
    }
    out.push(''); out.push(md ? '## Transcript' : 'TRANSCRIPT');
    segs.forEach((g) => {
      var head = [];
      if (s.speakers) head.push(md ? '**' + g.sp + '**' : g.sp);
      if (s.times) head.push(self.mmss(g.t));
      if (md) { if (head.length) out.push(''); if (head.length) out.push(head.join(' · ')); out.push(g.text); }
      else out.push((s.times ? '[' + self.mmss(g.t) + '] ' : '') + (s.speakers ? g.sp + ': ' : '') + g.text);
    });
    return out.join('\n');
  }
  renderVals() {
    var self = this, s = this.state;
    var fmts = [['md', 'Markdown', '.md'], ['txt', 'Plain text', '.txt'], ['srt', 'Subtitles', '.srt'], ['docx', 'Word', '.docx']];
    var ext = fmts.filter((f) => f[0] === s.format)[0][2];
    var srt = s.format === 'srt';
    var inc = [['summary', 'Summary', srt], ['actions', 'Action items', srt], ['times', 'Timestamps', srt], ['speakers', 'Speaker names', false]];
    return {
      formats: fmts.map((f) => ({ label: f[1], ext: f[2], on: s.format === f[0], bd: s.format === f[0] ? '1.5px solid #000' : '1px solid #ebe8e4', pick: () => self.setState({ format: f[0], status: '' }) })),
      includes: inc.map((o) => {
        var on = o[2] ? (o[0] === 'times') : s[o[0]];
        return { label: o[1], on: on, disabled: o[2], op: o[2] ? '0.45' : '1', bd: on ? '1.5px solid #000' : '1.5px solid #d6d1cb', bg: on ? '#000' : 'transparent', toggle: () => { var x = {}; x[o[0]] = !self.state[o[0]]; x.status = ''; self.setState(x); } };
      }),
      isSrt: srt,
      ranges: [{ id: 'all', label: 'Whole recording', span: '00:00 – 47:12' }, { id: 'ch', label: 'Chapter: PDF export', span: '12:15 – 24:30' }].map((r) => ({ label: r.label, span: r.span, on: s.range === r.id, ring: s.range === r.id ? '1.5px solid #000' : '1.5px solid #d6d1cb', pick: () => self.setState({ range: r.id, status: '' }) })),
      fileName: 'client-demo-q4-roadmap' + ext,
      preview: this.build(),
      previewFont: s.format === 'docx' ? "Inter, ui-sans-serif, system-ui, sans-serif" : "'Geist Mono', ui-monospace, monospace",
      previewSize: s.format === 'docx' ? '13px' : '12px',
      status: s.status,
      copyDisabled: s.format === 'docx', copyFg: s.format === 'docx' ? '#a59f97' : '#000',
      copy: () => { try { navigator.clipboard.writeText(self.build()); } catch (err) {} self.setState({ status: 'Copied to clipboard' }); },
      saveLabel: 'Save ' + ext,
      save: () => self.setState({ status: 'Saved client-demo-q4-roadmap' + ext + ' (demo)' })
    };
  }
}
</script>
</body>
</html>
