<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Idea 1 — Meeting autopilot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Geist+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input{font-family:inherit;cursor:pointer}
.orb{background:radial-gradient(circle at 32% 26%,#fff1e8 0%,rgba(255,241,232,0) 30%),radial-gradient(circle at 74% 70%,#0447ff 0%,rgba(4,71,255,0) 58%),radial-gradient(circle at 20% 80%,#ff4704 0%,rgba(255,71,4,0) 55%),radial-gradient(circle at 72% 20%,#f4a6c8 0%,rgba(244,166,200,0) 50%),#d8c8f0}
.spin{animation:spin 9s linear infinite}
.ping{animation:ping 3s ease-out infinite}
.still{animation:none}
.pop{animation:pop .18s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.55}60%{transform:scale(1.9);opacity:0}100%{transform:scale(1.9);opacity:0}}
@keyframes pop{0%{opacity:0;transform:translateX(8px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.spin,.ping{animation:none}}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.ib:hover{background:#f5f3f1!important}
.badge{width:22px;height:22px;border-radius:9999px;background:#fdfcfc;color:#000;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px}
</style>
</helmet>
<div data-name="Idea 1 / Meeting autopilot" style="width: 1100px; height: 720px; position: relative; overflow: hidden; background: #2b2825; font-family: Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif; font-size: 13px; letter-spacing: 0.01em; color: #000">

  <div aria-hidden="true" data-name="Context / Generic video call window" style="position: absolute; left: 80px; top: 64px; width: 760px; height: 480px; border-radius: 12px; background: #1e1c1a; box-shadow: rgba(0,0,0,0.45) 0 20px 50px; display: flex; flex-direction: column; overflow: hidden">
    <div style="height: 32px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid #2b2825; color: #a59f97; font-size: 12px"><span style="width: 9px; height: 9px; border-radius: 9999px; background: #45413c"></span><span style="width: 9px; height: 9px; border-radius: 9999px; background: #45413c"></span><span style="width: 9px; height: 9px; border-radius: 9999px; background: #45413c"></span><span style="margin-left: 10px">Video call — Weekly sync</span></div>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 6px">
      <div style="border-radius: 8px; background: #2b2825; display: flex; align-items: center; justify-content: center"><span style="width: 56px; height: 56px; border-radius: 9999px; background: #45413c; color: #d6d1cb; display: flex; align-items: center; justify-content: center; font-size: 17px">AK</span></div>
      <div style="border-radius: 8px; background: #2b2825; display: flex; align-items: center; justify-content: center"><span style="width: 56px; height: 56px; border-radius: 9999px; background: #45413c; color: #d6d1cb; display: flex; align-items: center; justify-content: center; font-size: 17px">MW</span></div>
      <div style="border-radius: 8px; background: #2b2825; display: flex; align-items: center; justify-content: center"><span style="width: 56px; height: 56px; border-radius: 9999px; background: #45413c; color: #d6d1cb; display: flex; align-items: center; justify-content: center; font-size: 17px">JS</span></div>
      <div style="border-radius: 8px; background: #2b2825; display: flex; align-items: center; justify-content: center"><span style="width: 56px; height: 56px; border-radius: 9999px; background: #45413c; color: #d6d1cb; display: flex; align-items: center; justify-content: center; font-size: 17px">You</span></div>
    </div>
    <div style="height: 52px; flex: none; display: flex; align-items: center; justify-content: center; gap: 10px"><span style="width: 36px; height: 36px; border-radius: 9999px; background: #2b2825"></span><span style="width: 36px; height: 36px; border-radius: 9999px; background: #2b2825"></span><span style="width: 36px; height: 36px; border-radius: 9999px; background: #2b2825"></span><span style="width: 52px; height: 36px; border-radius: 9999px; background: #45413c"></span></div>
  </div>

  <div data-name="Idea 1 / Floating recorder (interactive)" style="position: absolute; right: 20px; top: 240px; display: flex; flex-direction: row-reverse; align-items: center; gap: 6px">
    <button type="button" onClick="{{toggle}}" aria-label="{{dotAria}}" aria-expanded="{{open}}" style="position: relative; width: 44px; height: 44px; flex: none; padding: 0; border: 0; border-radius: 9999px; background: #fdfcfc; box-shadow: rgba(0,0,0,0.4) 0 6px 18px; display: flex; align-items: center; justify-content: center">
      <span class="orb {{pingClass}}" aria-hidden="true" style="position: absolute; width: 28px; height: 28px; border-radius: 9999px; filter: blur(1px)"></span>
      <span class="orb {{spinClass}}" aria-hidden="true" style="position: relative; width: 28px; height: 28px; border-radius: 9999px; filter: {{orbFilter}}"></span>
    </button>
    <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
      <div class="pop" data-name="Idea 1 / Floating recorder – controls" style="height: 40px; padding: 0 4px; border-radius: 9999px; background: #fdfcfc; box-shadow: rgba(0,0,0,0.4) 0 6px 18px; display: flex; align-items: center; gap: 2px">
        <button type="button" onClick="{{mark}}" aria-label="Mark moment" title="Mark moment" class="ib" style="width: 32px; height: 32px; border-radius: 9999px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg></button>
        <button type="button" onClick="{{pause}}" aria-label="{{pauseLabel}}" title="{{pauseLabel}}" class="ib" style="width: 32px; height: 32px; border-radius: 9999px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></sc-if>
          <sc-if value="{{running}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></sc-if>
        </button>
        <button type="button" onClick="{{stop}}" aria-label="Stop and transcribe" title="Stop and transcribe" style="width: 32px; height: 32px; border-radius: 9999px; border: 0; background: #000; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
        <button type="button" aria-label="Open Murmur" title="Open Murmur" class="ib" style="width: 32px; height: 32px; border-radius: 9999px; border: 0; background: transparent; color: #777169; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M10 20H4v-6"/></svg></button>
      </div>
    </sc-if>
    <sc-if value="{{hasFlash}}" hint-placeholder-val="{{ false }}">
      <span class="pop" role="status" style="position: absolute; right: 0; top: 52px; white-space: nowrap; height: 28px; padding: 0 10px; border-radius: 9999px; background: #fdfcfc; box-shadow: rgba(0,0,0,0.35) 0 6px 16px; display: flex; align-items: center; gap: 6px; font-size: 12px"><svg width="10" height="11" viewBox="0 0 24 24" fill="#000" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>{{flash}}</span>
    </sc-if>
  </div>
  <span class="badge" data-name="Annotation / 2" style="position: absolute; right: 31px; top: 210px">2</span>

  <div data-name="Idea 1 / States" style="position: absolute; left: 80px; bottom: 20px; padding: 10px 14px; border-radius: 16px; background: #fdfcfc; display: flex; align-items: center; gap: 20px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="position: relative; width: 34px; height: 34px; border-radius: 9999px; background: #fdfcfc; box-shadow: rgba(0,0,0,0.25) 0 2px 8px; display: flex; align-items: center; justify-content: center"><span class="orb ping" style="position: absolute; width: 20px; height: 20px; border-radius: 9999px"></span><span class="orb spin" style="position: relative; width: 20px; height: 20px; border-radius: 9999px"></span></span>
      <span style="font-size: 12px">Recording<br><span style="color: #777169; font-size: 11px">slow spin + pulse every 3 s</span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px">
      <span style="height: 30px; padding: 0 3px; border-radius: 9999px; box-shadow: rgba(0,0,0,0.25) 0 2px 8px; display: flex; align-items: center; gap: 2px"><span style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4-6 4z"/></svg></span><span style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span><span style="width: 24px; height: 24px; border-radius: 9999px; background: #000; display: flex; align-items: center; justify-content: center"><svg width="7" height="7" viewBox="0 0 24 24" fill="#fff"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></span></span>
      <span style="width: 34px; height: 34px; border-radius: 9999px; box-shadow: rgba(0,0,0,0.25) 0 2px 8px; display: flex; align-items: center; justify-content: center"><span class="orb spin" style="width: 20px; height: 20px; border-radius: 9999px"></span></span>
      <span style="margin-left: 4px; font-size: 12px">Click → controls</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="height: 26px; padding: 0 9px; border-radius: 9999px; box-shadow: rgba(0,0,0,0.25) 0 2px 8px; display: flex; align-items: center; gap: 5px; font-size: 11px"><svg width="9" height="10" viewBox="0 0 24 24" fill="#000"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Marked <span class="mono">12:41</span></span>
      <span style="font-size: 12px">Mark</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 34px; height: 34px; border-radius: 9999px; box-shadow: rgba(0,0,0,0.25) 0 2px 8px; display: flex; align-items: center; justify-content: center"><span class="orb" style="width: 20px; height: 20px; border-radius: 9999px; filter: grayscale(0.9)"></span></span>
      <span style="font-size: 12px">Paused<br><span style="color: #777169; font-size: 11px">grey, no motion</span></span>
    </div>
  </div>
  <span class="badge" data-name="Annotation / 3" style="position: absolute; left: 68px; bottom: 74px">3</span>

  <div data-name="Idea 1 / Call detected toast" style="position: absolute; right: 20px; bottom: 20px; width: 320px; padding: 14px; border-radius: 16px; background: #fdfcfc; box-shadow: rgba(0,0,0,0.4) 0 14px 36px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: flex-start; gap: 10px">
      <span class="orb" aria-hidden="true" style="width: 24px; height: 24px; border-radius: 9999px; flex: none"></span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 500">Call detected</span><span style="font-size: 12px; color: #777169">Microsoft Teams is playing call audio.</span></div>
      <button type="button" aria-label="Dismiss" class="ib" style="width: 24px; height: 24px; border-radius: 9999px; border: 0; background: transparent; color: #777169; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1; height: 32px; border-radius: 9999px; border: 0; background: #000; color: #fff; font-size: 13px; font-weight: 500">Record</button>
      <button type="button" class="ib" style="height: 32px; padding: 0 12px; border-radius: 9999px; border: 1px solid #e5e5e5; background: #fdfcfc; font-size: 13px; font-weight: 500">Not now</button>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #44403b"><input type="checkbox" style="width: 13px; height: 13px; accent-color: #000">Always record calls from this app</label>
  </div>
  <span class="badge" data-name="Annotation / 1" style="position: absolute; right: 352px; bottom: 150px">1</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false, paused: false, flash: '' };
    this.t = null;
  }
  componentWillUnmount() { if (this.t) clearTimeout(this.t); }
  flashMsg(text) {
    this.setState({ flash: text });
    if (this.t) clearTimeout(this.t);
    this.t = setTimeout(() => this.setState({ flash: '' }), 2200);
  }
  renderVals() {
    var self = this, s = this.state;
    return {
      open: s.open, paused: s.paused, running: !s.paused,
      dotAria: s.open ? 'Hide recording controls' : 'Show recording controls',
      spinClass: s.paused ? 'still' : 'spin', pingClass: s.paused ? 'still' : 'ping',
      orbFilter: s.paused ? 'grayscale(0.9)' : 'none',
      pauseLabel: s.paused ? 'Resume' : 'Pause',
      toggle: () => self.setState({ open: !self.state.open }),
      pause: () => { self.setState({ paused: !self.state.paused }); self.flashMsg(self.state.paused ? 'Recording' : 'Paused'); },
      mark: () => self.flashMsg('Marked 12:41'),
      stop: () => { self.setState({ open: false, paused: false }); self.flashMsg('Saved — transcribing'); },
      hasFlash: !!s.flash, flash: s.flash
    };
  }
}
</script>
</body>
</html>
