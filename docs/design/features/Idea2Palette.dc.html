<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Idea 2 — Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Geist+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input{font-family:inherit}
.orb{background:radial-gradient(circle at 32% 26%,#fff1e8 0%,rgba(255,241,232,0) 30%),radial-gradient(circle at 74% 70%,#0447ff 0%,rgba(4,71,255,0) 58%),radial-gradient(circle at 20% 80%,#ff4704 0%,rgba(255,71,4,0) 55%),radial-gradient(circle at 72% 20%,#f4a6c8 0%,rgba(244,166,200,0) 50%),#d8c8f0}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
input::placeholder{color:#777169}
mark{background:#000;color:#fff;border-radius:3px;padding:0 2px}
</style>
</helmet>
<div data-name="Idea 2 / Command palette" style="width: 1100px; height: 720px; position: relative; overflow: hidden; background: #fdfcfc; font-family: Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif; font-size: 13px; letter-spacing: 0.01em; color: #000; display: flex">

  <nav aria-hidden="true" data-name="Context / Sidebar" style="width: 200px; flex: none; padding: 14px 12px; border-right: 1px solid #ebe8e4; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px"><span class="orb" style="width: 18px; height: 18px; border-radius: 9999px"></span><span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em">Murmur</span></div>
    <div style="height: 32px; border-radius: 9999px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 500">New recording</div>
    <div style="display: flex; flex-direction: column; gap: 2px; color: #44403b">
      <div style="height: 32px; padding: 0 10px; border-radius: 9999px; background: #f5f3f1; color: #000; font-weight: 500; display: flex; align-items: center">Library</div>
      <div style="height: 32px; padding: 0 10px; display: flex; align-items: center">Ask AI</div>
      <div style="height: 32px; padding: 0 10px; display: flex; align-items: center">Settings</div>
    </div>
    <div style="height: 28px; padding: 0 10px; border-radius: 9999px; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; color: #777169; font-size: 12px">Search<span class="mono" style="font-size: 11px">Ctrl K</span></div>
  </nav>
  <main aria-hidden="true" data-name="Context / Library" style="flex: 1; padding: 56px 40px; display: flex; flex-direction: column; gap: 20px">
    <div style="font-size: 24px; font-weight: 300; letter-spacing: -0.02em">What are we recording today?</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="height: 160px; border-radius: 20px; background: #f5f3f1"></div>
      <div style="height: 160px; border-radius: 20px; background: #f5f3f1"></div>
    </div>
    <div style="border: 1px solid #ebe8e4; border-radius: 16px; overflow: hidden">
      <div style="height: 56px; border-bottom: 1px solid #ebe8e4"></div>
      <div style="height: 56px; border-bottom: 1px solid #ebe8e4"></div>
      <div style="height: 56px"></div>
    </div>
  </main>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,19,18,0.32)"></div>

  <div role="dialog" aria-label="Command palette" data-name="Idea 2 / Palette" style="position: absolute; left: 50%; top: 72px; transform: translateX(-50%); width: 560px; border-radius: 16px; background: #fdfcfc; box-shadow: rgba(0,0,0,0.3) 0 20px 56px, rgba(0,0,0,0.2) 0 0 1px; display: flex; flex-direction: column; overflow: hidden">
    <div data-name="Palette / Search field" style="height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #ebe8e4">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#777169" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <label for="pal" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search everything</label>
      <input id="pal" type="text" value="{{q}}" onChange="{{onQ}}" onKeyDown="{{onKey}}" placeholder="Search recordings, transcripts and actions…" autocomplete="off" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; color: #000">
      <span class="mono" style="font-size: 11px; padding: 2px 7px; border-radius: 5px; background: #f5f3f1; color: #44403b">Esc</span>
    </div>
    <div data-name="Palette / Results" style="max-height: 440px; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 1px">
          <div style="padding: 6px 10px 3px; font-size: 11px; color: #777169">{{g.label}}</div>
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <button type="button" onClick="{{it.pick}}" onMouseEnter="{{it.hover}}" style="width: 100%; min-height: 36px; text-align: left; border: 0; border-radius: 10px; padding: 6px 10px; background: {{it.bg}}; color: #000; display: flex; align-items: center; gap: 10px; cursor: pointer">
              <span style="width: 24px; height: 24px; flex: none; border-radius: 7px; background: {{it.plate}}; display: flex; align-items: center; justify-content: center">
                <sc-if value="{{it.isAction}}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L4 14h7l-1 7 9-11h-7z"/></svg></sc-if>
                <sc-if value="{{it.isRec}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"/></svg></sc-if>
                <sc-if value="{{it.isLine}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg></sc-if>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                <span style="font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span>
                <sc-if value="{{it.isLine}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #44403b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.pre}}<mark>{{it.hit}}</mark>{{it.post}}</span></sc-if>
                <sc-if value="{{it.hasSub}}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; color: #777169; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.sub}}</span></sc-if>
              </span>
              <span class="mono" style="flex: none; font-size: 11px; color: #777169">{{it.meta}}</span>
              <sc-if value="{{it.active}}" hint-placeholder-val="{{ false }}"><span class="mono" aria-hidden="true" style="flex: none; font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid #e5e5e5; color: #44403b">↵</span></sc-if>
            </button>
          </sc-for>
        </div>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 28px 12px; text-align: center; color: #777169">Nothing found for “{{q}}”.</div>
      </sc-if>
    </div>
    <div data-name="Palette / Footer" style="height: 36px; padding: 0 16px; border-top: 1px solid #ebe8e4; display: flex; align-items: center; gap: 14px; font-size: 11px; color: #777169">
      <span><span class="mono">↑ ↓</span> navigate</span>
      <span><span class="mono">↵</span> open</span>
      <span><span class="mono">Esc</span> close</span>
      <span style="margin-left: auto; color: #000">{{status}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: 'pdf', active: 0, opened: '' };
    this.actions = [
      { title: 'Start recording', sub: 'Mic + system audio', meta: 'Ctrl Shift R' },
      { title: 'Ask AI…', sub: 'Question across the whole library', meta: 'Ctrl J' },
      { title: 'Export current recording…', sub: 'Markdown, text, SRT or Word', meta: 'Ctrl E' },
      { title: 'Switch to dark theme', sub: '', meta: '' },
      { title: 'Open settings', sub: '', meta: 'Ctrl ,' }
    ];
    this.recs = [
      { title: 'Client demo — Q4 roadmap', sub: 'Today, 10:30 · 47:12', text: 'roadmap search pdf export summaries action items demo invite' },
      { title: 'Voice note', sub: 'Today, 09:05 · 03:18', text: 'waveform peaks gemma unload' },
      { title: 'Weekly team sync', sub: 'Today, 08:00 · 58:40', text: 'aot build capture wasapi budget gpu test machine' },
      { title: 'Interview — Senior .NET', sub: 'Yesterday, 16:00 · 1:02:15', text: 'ring buffer capture callback worker process' },
      { title: 'QA team sync', sub: 'Yesterday, 11:00 · 34:09', text: 'windows arm x64 cpu budget test plan' },
      { title: 'Sprint retro', sub: 'Mon, 14:00 · 41:27', text: 'aot ci pdf export report template designer' }
    ];
    this.lines = [
      { rec: 'Client demo', t: '12:40', text: 'Great. What about PDF export? We need it for our reports.' },
      { rec: 'Client demo', t: '12:52', text: 'PDF export moves to next sprint — first we finish meeting summaries and action items.' },
      { rec: 'Sprint retro', t: '31:05', text: 'For PDF export, let’s show the report template to the designer first.' },
      { rec: 'Weekly team sync', t: '31:00', text: 'The budget for the GPU test machine is approved — I’ll order it on Monday.' },
      { rec: 'Interview', t: '05:18', text: 'I’d start with a lock-free ring buffer and keep the capture callback allocation-free.' },
      { rec: 'QA team sync', t: '04:00', text: 'We’ll leave Windows 11 ARM testing for later and do x64 first.' },
      { rec: 'Client demo', t: '13:24', text: 'Deal. I’ll send the invite today.' }
    ];
  }
  results() {
    var q = this.state.q.trim().toLowerCase();
    var groups = [];
    if (!q) {
      groups.push({ label: 'Suggested', items: this.actions.slice(0, 3).map((a) => ({ kind: 'action', title: a.title, sub: a.sub, meta: a.meta })) });
      groups.push({ label: 'Recent recordings', items: this.recs.slice(0, 3).map((r) => ({ kind: 'rec', title: r.title, sub: r.sub, meta: '' })) });
      return groups;
    }
    var acts = this.actions.filter((a) => a.title.toLowerCase().indexOf(q) >= 0 || a.sub.toLowerCase().indexOf(q) >= 0).slice(0, 3);
    if (acts.length) groups.push({ label: 'Actions', items: acts.map((a) => ({ kind: 'action', title: a.title, sub: a.sub, meta: a.meta })) });
    var recs = this.recs.filter((r) => (r.title + ' ' + r.text).toLowerCase().indexOf(q) >= 0).slice(0, 3);
    if (recs.length) groups.push({ label: 'Recordings', items: recs.map((r) => ({ kind: 'rec', title: r.title, sub: r.sub, meta: '' })) });
    var lines = this.lines.filter((l) => l.text.toLowerCase().indexOf(q) >= 0).slice(0, 4);
    if (lines.length) groups.push({ label: 'In transcripts', items: lines.map((l) => {
      var i = l.text.toLowerCase().indexOf(q);
      var pre = l.text.slice(0, i);
      if (pre.length > 42) pre = '…' + pre.slice(pre.length - 42);
      return { kind: 'line', title: l.rec, sub: '', meta: l.t, pre: pre, hit: l.text.slice(i, i + q.length), post: l.text.slice(i + q.length) };
    }) });
    return groups;
  }
  renderVals() {
    var self = this;
    var groups = this.results();
    var flat = [];
    groups.forEach((g) => g.items.forEach((it) => flat.push(it)));
    var active = Math.min(this.state.active, Math.max(0, flat.length - 1));
    var idx = 0;
    var view = groups.map((g) => ({
      label: g.label,
      items: g.items.map((it) => {
        var my = idx++;
        var on = my === active;
        var label = it.kind === 'line' ? (it.title + ' at ' + it.meta) : it.title;
        return {
          title: it.title, sub: it.sub, meta: it.meta, pre: it.pre || '', hit: it.hit || '', post: it.post || '',
          isAction: it.kind === 'action', isRec: it.kind === 'rec', isLine: it.kind === 'line', hasSub: !!it.sub && it.kind !== 'line',
          active: on, bg: on ? '#f5f3f1' : 'transparent', plate: on ? '#ebe8e4' : '#f5f3f1',
          hover: () => self.setState({ active: my }),
          pick: () => self.setState({ active: my, opened: 'Would open: ' + label })
        };
      })
    }));
    return {
      q: this.state.q,
      onQ: (e) => self.setState({ q: e.target.value, active: 0, opened: '' }),
      onKey: (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); self.setState({ active: Math.min(flat.length - 1, active + 1) }); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); self.setState({ active: Math.max(0, active - 1) }); }
        else if (e.key === 'Enter' && flat[active]) { e.preventDefault(); var it = flat[active]; self.setState({ opened: 'Would open: ' + (it.kind === 'line' ? it.title + ' at ' + it.meta : it.title) }); }
        else if (e.key === 'Escape') { e.preventDefault(); self.setState({ q: '', active: 0, opened: '' }); }
      },
      groups: view,
      empty: flat.length === 0,
      status: this.state.opened || (flat.length ? flat.length + ' results' : '')
    };
  }
}
</script>
</body>
</html>
