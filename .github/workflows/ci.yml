name: ci

# Repo standard v1.1: every PR gets the Linux job; the Windows jobs (build/test/AOT, startup, installer, capture e2e)
# and the benchmarks run only on the release PR (dev -> main) or on a manual run with no open PR (inputs `windows`, `bench`).
# The first job, `base`, resolves the real PR base once; every later decision (Windows jobs, gate) follows its output,
# never the manual inputs, so a manual run cannot put a green `ci` without the Windows jobs on a release PR head.
# Everyday Windows checks run on the owner's PC: scripts/verify-local.ps1. The last job, `ci`, is the only required check.
on:
  # STANDARD (repo standard v1.1): every PR gets `ci`, whatever its base; base changes re-run via ci-retarget.yml.
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: "Leave empty. Used only when this branch has no open PR; an open PR's base always wins (ci-retarget.yml sets it)"
        required: false
        type: string
      windows:
        description: Run the Windows jobs (build, tests, AOT publish, startup, installer, capture e2e)
        type: boolean
        default: true
      bench:
        description: Run BenchmarkDotNet (windows-latest, ~30 min)
        type: boolean
        default: false

concurrency:
  # Separate groups for PR runs and manual runs: a manual run on `dev` must not cancel the release PR run.
  group: ci-${{ github.event_name == 'pull_request' && 'pr' || 'manual' }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # Resolves the real PR base. pull_request: the event's base. Otherwise: the base of the open PRs of this head branch
  # (REST), and main wins if any of them targets main; the manual input `base` counts only when there is no open PR.
  base:
    name: resolve PR base
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.resolve.outputs.base }}
      has_pr: ${{ steps.resolve.outputs.has_pr }}
      policy_ok: ${{ steps.resolve.outputs.policy_ok }}
    steps:
      - id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          INPUT_BASE: ${{ inputs.base }}
          HEAD: ${{ github.head_ref || github.ref_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          has_pr=false
          if [ "$EVENT" = pull_request ]; then
            has_pr=true
            base=$BASE_REF
          else
            prs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f head="$OWNER:$HEAD" -f state=open --jq '.[].base.ref')
            if [ -n "$prs" ]; then
              has_pr=true
              if grep -qx main <<<"$prs"; then base=main; else base=$(head -n 1 <<<"$prs"); fi
              if [ -n "$INPUT_BASE" ] && [ "$INPUT_BASE" != "$base" ]; then
                echo "::notice::Input base '$INPUT_BASE' ignored: the open PR of $HEAD targets '$base'."
              fi
            else
              base=$INPUT_BASE
            fi
          fi
          case "$base" in
            *[!A-Za-z0-9._/-]*) echo "::error::Unexpected characters in the base branch name."; exit 1 ;;
          esac
          # Windows jobs are worth running only for a PR that the gate will accept: dev of this repo into main.
          policy_ok=false
          if [ "$base" = main ] && [ "$HEAD" = dev ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then policy_ok=true; fi
          {
            echo "base=$base"
            echo "has_pr=$has_pr"
            echo "policy_ok=$policy_ok"
          } >> "$GITHUB_OUTPUT"
          echo "base='$base' has_pr=$has_pr policy_ok=$policy_ok (head $HEAD_REPO:$HEAD, event $EVENT)"

  linux:
    name: build, test, AOT publish (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Explicit shell: GitHub then runs steps as `bash --noprofile --norc -eo pipefail {0}`,
    # so a failing `dotnet publish | tee` fails the step (the default `bash -e {0}` has no pipefail).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # global.json pins a prerelease SDK with rollForward=latestFeature, and setup-dotnet alone would
      # only install channel 11.0 (major.minor). dotnet-version pins the exact SDK; the check step
      # below fails the job if `dotnet --version` is anything other than the global.json pin.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 11.0.100-rc.2.26504.105

      - name: Verify SDK matches global.json
        run: test "$(dotnet --version)" = "$(jq -r .sdk.version global.json)"

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Build
        run: dotnet build Murmur.sln -c Release

      # Tests run on Microsoft.Testing.Platform (global.json); xunit.v3 provides --report-xunit-trx
      # (the VSTest-style "--logger trx" is rejected with exit code 5 on this runner).
      - name: Test
        run: dotnet test Murmur.sln -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

      # The design-parity tests (tests/Murmur.App.Tests/Design) run with the tests above and write their report and images here.
      - name: Upload design parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-parity
          path: artifacts/design-parity
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Native AOT (Murmur.Desktop, linux-x64)
        run: |
          mkdir -p artifacts/logs
          dotnet publish src/Murmur.Desktop -c Release -f net11.0 -r linux-x64 -o artifacts/publish/linux-x64/desktop 2>&1 | tee artifacts/logs/publish-desktop.log

      - name: Publish Native AOT (Murmur.Transcription, linux-x64)
        run: |
          mkdir -p artifacts/logs
          dotnet publish src/Murmur.Transcription -c Release -r linux-x64 -o artifacts/publish/linux-x64/transcription 2>&1 | tee artifacts/logs/publish-transcription.log

      # Any compiler, trim (IL2xxx) or AOT (IL3xxx) warning in the publish logs is a red build.
      - name: Fail on publish warnings
        run: |
          if grep -nE ': (warning|error) ' artifacts/logs/publish-*.log; then
            echo "::error::Native AOT publish produced warnings or errors (see above)"
            exit 1
          fi
          echo "No publish warnings."

  windows:
    name: build, test, AOT publish (win-x64)
    needs: base
    # Release PR (resolved base main, dev of this repo), or a manual run with `windows` = true when no PR is open.
    # An open PR's base always wins over the manual inputs, so a PR into main always gets these jobs.
    if: ${{ (needs.base.outputs.base == 'main' && needs.base.outputs.policy_ok == 'true') || (github.event_name == 'workflow_dispatch' && needs.base.outputs.has_pr != 'true' && needs.base.outputs.base != 'main' && inputs.windows) }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      # See the linux job: dotnet-version pins the exact prerelease SDK, the next step verifies it.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 11.0.100-rc.2.26504.105

      - name: Verify SDK matches global.json
        run: |
          $expected = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $actual = (dotnet --version).Trim()
          if ($actual -ne $expected) { throw "SDK mismatch: dotnet --version is $actual, global.json pins $expected" }

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        id: build
        run: |
          dotnet build Murmur.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: |
          dotnet test Murmur.sln -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Player seek recovery
        if: always()
        run: if (Test-Path artifacts/test-results/player-recovery.txt) { Get-Content artifacts/test-results/player-recovery.txt }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

      # Murmur.exe and Murmur.Transcription.exe are published side by side into one folder.
      - name: Publish Native AOT (Murmur.Desktop, win-x64)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          New-Item -ItemType Directory -Force artifacts/logs | Out-Null
          dotnet publish src/Murmur.Desktop -c Release -f net11.0-windows10.0.22621.0 -r win-x64 -o artifacts/publish/win-x64 2>&1 | Tee-Object -FilePath artifacts/logs/publish-desktop.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Native AOT (Murmur.Transcription, win-x64)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet publish src/Murmur.Transcription -c Release -r win-x64 -o artifacts/publish/win-x64 2>&1 | Tee-Object -FilePath artifacts/logs/publish-transcription.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fail on publish warnings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $hits = Select-String -Path artifacts/logs/publish-*.log -Pattern ': (warning|error) '
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Line }
            Write-Host "::error::Native AOT publish produced warnings or errors (see above)"
            exit 1
          }
          Write-Host "No publish warnings."

      - name: Publish size table
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $dir = 'artifacts/publish/win-x64'
          if (-not (Test-Path $dir)) {
            'No publish output.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          $files = Get-ChildItem $dir -File -Recurse | Where-Object { $_.Extension -in '.exe', '.dll' } | Sort-Object Length -Descending
          $lines = @('### win-x64 publish size', '', '| File | Size, MB |', '|---|---:|')
          foreach ($f in $files) {
            $lines += ('| {0} | {1:N2} |' -f $f.Name, ($f.Length / 1MB))
          }
          $total = ($files | Measure-Object Length -Sum).Sum
          $lines += ('| **Total (exe + dll)** | **{0:N2}** |' -f ($total / 1MB))
          $lines | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload win-x64 publish
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: murmur-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error
          retention-days: 14

  startup:
    name: startup budget (win-x64)
    needs: windows
    # Run on the published artifact even when a unit test failed, so perf/e2e evidence is never lost.
    if: ${{ !cancelled() && needs.windows.result != 'skipped' }}
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: murmur-win-x64
          path: artifacts/publish/win-x64

      # Run 1 is the cold run (first launch after extraction); the median of 7 runs must stay within 400 ms.
      - name: Measure startup
        run: |
          pwsh scripts/measure-startup.ps1 -Exe artifacts/publish/win-x64/Murmur.exe -Runs 7 -BudgetMs 400
          $code = $LASTEXITCODE
          if (Test-Path artifacts/perf/startup.md) {
            Get-Content artifacts/perf/startup.md -Raw | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          exit $code

      - name: Upload startup measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-startup
          path: artifacts/perf/startup.json
          if-no-files-found: warn
          retention-days: 14

  # The per-user Inno Setup installer (installer/Murmur.iss, D-036) built from the publish folder of the `windows` job
  # (no second publish): silent install into a temp folder, startup of the installed exe, silent uninstall, user data kept.
  installer:
    name: installer (Inno Setup, win-x64)
    needs: windows
    # Run on the published artifact even when a unit test failed, so perf/e2e evidence is never lost.
    if: ${{ !cancelled() && needs.windows.result != 'skipped' }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: murmur-win-x64
          path: artifacts/publish/win-x64

      # ISCC may already be on the image; scripts/build-installer.ps1 looks in PATH and the usual Inno Setup 6 folders.
      # installer/Murmur.iss needs Inno Setup 6.3 (x64compatible): an older image copy is upgraded.
      - name: Inno Setup
        run: |
          # The install folders first: PATH can hold a Chocolatey shim whose file version is 0.0.0.0.
          $known = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $known | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ((Get-Item $iscc).VersionInfo.FileVersionRaw -lt [version]'6.3') {
            Write-Host "Inno Setup at $iscc is older than 6.3, upgrading."
            choco upgrade innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Inno Setup is already installed: $iscc ($((Get-Item $iscc).VersionInfo.FileVersionRaw))"
          }

      - name: Build installer
        run: |
          pwsh scripts/build-installer.ps1 -SkipPublish
          $code = $LASTEXITCODE
          if (Test-Path artifacts/installer/payload.md) {
            Get-Content artifacts/installer/payload.md -Raw | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          exit $code

      # Silent install into a temp folder -> Murmur.exe + Murmur.Transcription.exe present -> startup check of the
      # installed exe (every run renders a frame; the median is reported, the startup job enforces the budget) ->
      # silent uninstall -> folder gone, user data kept.
      - name: Install, start, uninstall
        run: |
          $setup = (Get-ChildItem artifacts/installer -Filter 'Murmur-Setup-*.exe' | Select-Object -First 1).FullName
          pwsh scripts/verify-local.ps1 -Installer -SetupExe $setup
          $code = $LASTEXITCODE
          $report = Get-ChildItem artifacts/local-verify -Filter report.md -Recurse | Select-Object -First 1
          if ($report) { Get-Content $report.FullName -Raw | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          # A skipped step must not look green: the report has to say PASS for the installer.
          if ($code -eq 0 -and -not ($report -and (Select-String -Path $report.FullName -SimpleMatch '| Installer | PASS |' -Quiet))) {
            Write-Host '::error::The installer smoke test did not report PASS (skipped?)'
            exit 1
          }
          exit $code

      - name: Upload installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: murmur-installer
          path: |
            artifacts/installer/Murmur-Setup-*.exe
            artifacts/installer/Murmur-Setup-*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-verify
          path: artifacts/local-verify
          if-no-files-found: warn
          retention-days: 14

  # End-to-end capture on a runner without real audio hardware: a virtual sound card (VB-Audio Virtual Cable)
  # gives WASAPI a render endpoint, a looping 440 Hz tone is played into it and Murmur records it through
  # WASAPI loopback.
  capture-e2e:
    name: capture e2e (win-x64, virtual audio)
    needs: windows
    # Run on the published artifact even when a unit test failed, so perf/e2e evidence is never lost.
    if: ${{ !cancelled() && needs.windows.result != 'skipped' }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: murmur-win-x64
          path: artifacts/publish/win-x64

      # The Murmur.Capture.Windows.Tests step below builds from source, so the pinned SDK is needed here too.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 11.0.100-rc.2.26504.105

      - name: Verify SDK matches global.json
        run: |
          $expected = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $actual = (dotnet --version).Trim()
          if ($actual -ne $expected) { throw "SDK mismatch: dotnet --version is $actual, global.json pins $expected" }

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Installs the VB-Audio Virtual Cable sound card and starts the Windows Audio service. Allowed to fail:
      # the failure is reported in the summary ("no audio device") and the recording checks decide the verdict.
      - name: Virtual audio device (VB-CABLE)
        id: audio
        continue-on-error: true
        uses: LABSN/sound-ci-helpers@v1

      - name: Media Foundation
        id: mf
        continue-on-error: true
        run: |
          $line = & ./scripts/ensure-media-foundation.ps1 | Select-Object -Last 1
          Write-Host $line
          "mf_status=$line" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Audio environment report
        if: ${{ !cancelled() }}
        env:
          AUDIO_OUTCOME: ${{ steps.audio.outcome }}
          MF_STATUS: ${{ steps.mf.outputs.mf_status }}
        run: |
          $devices = @(Get-CimInstance Win32_SoundDevice -ErrorAction SilentlyContinue)
          $devices | Format-Table Name, Status, Manufacturer | Out-String | Write-Host
          $audio = if ($env:AUDIO_OUTCOME -eq 'success' -and $devices.Count -gt 0) { "installed ($($devices.Count) device(s): $(($devices | ForEach-Object Name) -join ', '))" }
                   elseif ($devices.Count -gt 0) { "install step $env:AUDIO_OUTCOME, but $($devices.Count) device(s) present: $(($devices | ForEach-Object Name) -join ', ')" }
                   else { "**no audio device** (install step: $env:AUDIO_OUTCOME)" }
          @(
            '### Capture e2e environment', '',
            '| Item | Status |', '|---|---|',
            "| Virtual audio device | $audio |",
            "| Media Foundation | $(if ($env:MF_STATUS) { $env:MF_STATUS } else { 'step did not report' }) |",
            ''
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($devices.Count -eq 0) { Write-Host '::warning::No audio device: WASAPI loopback has no render endpoint, the recording checks are expected to fail.' }

      # 10 s 440 Hz stereo tone, looped by SoundPlayer.PlayLooping() in a separate hidden pwsh process.
      - name: Start looping tone
        id: tone
        run: |
          $out = & ./scripts/start-tone.ps1 -DurationS 900 | Select-Object -Last 1
          $code = $LASTEXITCODE
          Write-Host $out
          "- $out" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $code

      # Windows-trait tests run for real here because a render endpoint exists.
      - name: Murmur.Capture.Windows tests
        if: ${{ !cancelled() }}
        run: |
          dotnet test --project tests/Murmur.Capture.Windows.Tests -c Release --report-xunit-trx --results-directory artifacts/capture-e2e/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tone alive (before autorecord)
        if: ${{ !cancelled() }}
        run: pwsh scripts/check-tone.ps1 -Label 'before Autorecord 60 s'

      - name: Autorecord 60 s (audio + screen)
        if: ${{ !cancelled() }}
        run: pwsh scripts/run-autorecord.ps1 -Exe artifacts/publish/win-x64/Murmur.exe -Seconds 60 -Screen -PerfOut artifacts/perf/rec60.json

      - name: Check recording
        if: ${{ !cancelled() }}
        run: |
          pwsh scripts/check-recording.ps1 -PerfJson artifacts/perf/rec60.json -ExpectTone -ExpectScreen -Title 'capture-e2e: 60 s audio + screen' -MarkdownOut artifacts/capture-e2e/check.md
          $code = $LASTEXITCODE
          if (Test-Path artifacts/capture-e2e/check.md) {
            Get-Content artifacts/capture-e2e/check.md -Raw | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          exit $code

      - name: Stop tone
        if: always()
        run: |
          $pidFile = 'artifacts/tone/tone.pid'
          if (Test-Path $pidFile) {
            Stop-Process -Id ([int](Get-Content $pidFile -Raw).Trim()) -Force -ErrorAction SilentlyContinue
          }

      - name: Collect session folder
        if: always()
        run: |
          New-Item -ItemType Directory -Force artifacts/capture-e2e | Out-Null
          if (Test-Path artifacts/perf/rec60.json) {
            Copy-Item artifacts/perf/rec60.json artifacts/capture-e2e/rec60.json
            $folder = (Get-Content artifacts/perf/rec60.json -Raw | ConvertFrom-Json).session.folder
            if ($folder -and (Test-Path -LiteralPath $folder)) {
              Copy-Item -LiteralPath $folder -Destination artifacts/capture-e2e/session -Recurse -Force
            } else {
              Write-Host "Session folder not found: $folder"
            }
          } else {
            Write-Host 'No perf JSON to collect.'
          }
          if (Test-Path artifacts/tone) { Copy-Item artifacts/tone/*.log -Destination artifacts/capture-e2e -ErrorAction SilentlyContinue }

      - name: Upload capture-e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-e2e
          path: artifacts/capture-e2e
          if-no-files-found: warn
          retention-days: 14

  bench:
    name: benchmarks
    needs: base
    # Release PR (resolved base main, dev of this repo), or a manual run with `bench` = true when no PR is open.
    # An open PR's base always wins over the manual inputs, so a PR into main always gets these jobs.
    if: ${{ (needs.base.outputs.base == 'main' && needs.base.outputs.policy_ok == 'true') || (github.event_name == 'workflow_dispatch' && needs.base.outputs.has_pr != 'true' && needs.base.outputs.base != 'main' && inputs.bench) }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      # See the linux job: dotnet-version pins the exact prerelease SDK, the next step verifies it.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 11.0.100-rc.2.26504.105

      - name: Verify SDK matches global.json
        run: |
          $expected = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $actual = (dotnet --version).Trim()
          if ($actual -ne $expected) { throw "SDK mismatch: dotnet --version is $actual, global.json pins $expected" }

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run BenchmarkDotNet
        run: |
          dotnet run -c Release --project tests/Murmur.Benchmarks -- --filter "*" --job short --exporters json github --artifacts artifacts/bench
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Benchmark summary
        if: always()
        run: |
          if (Test-Path artifacts/bench) {
            Get-ChildItem artifacts/bench -Recurse -Filter '*-report-github.md' | ForEach-Object {
              "### $($_.BaseName -replace '-report-github$', '')" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Get-Content $_.FullName -Raw | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: artifacts/bench
          if-no-files-found: warn
          retention-days: 14

  # STANDARD: the only required check. Keep the id `ci` with no `name:`; no matrix, no paths filter, no reusable workflow.
  # `needs` lists every other job of this file; MAY_SKIP (in the last step) lists the jobs that may be skipped by design; it is empty when the base is main.
  ci:
    if: always()
    needs: [base, linux, windows, startup, installer, capture-e2e, bench]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Base policy (into dev; into main only from dev)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ needs.base.outputs.base }}
          HEAD: ${{ github.head_ref || github.ref_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          case "$BASE" in
            dev) ;;
            main)
              if [ "$HEAD" != dev ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
                echo "::error::PRs into main must come from dev of this repo (head: $HEAD_REPO:$HEAD). Retarget the PR to dev."
                exit 1
              fi ;;
            "") echo "::notice::No open PR for $HEAD, so the base policy was not checked." ;;
            *) echo "::error::Base '$BASE' is not dev or main. Stacked PRs are outside the standard: merge dev into the branch and retarget the PR to dev."; exit 1 ;;
          esac
          # A pull_request run keeps the base from its event. If the PR was retargeted mid-run, this run is stale and
          # fails itself (the retarget run decides). A failed REST call fails closed.
          if [ "$EVENT" = pull_request ]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .base.ref) || { echo "::error::Could not read the current PR base."; exit 1; }
            if [ "$current" != "$BASE" ]; then
              echo "::error::Base changed during the run ($BASE -> $current); the retarget run decides."
              exit 1
            fi
          fi
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          BASE: ${{ needs.base.outputs.base }}
        run: |
          # On main every job must succeed. Otherwise (or if `base` itself failed) only the Windows jobs and `bench`
          # may be skipped by design.
          MAY_SKIP="windows startup installer capture-e2e bench"
          if [ "$BASE" = main ] || [ "$(jq -r '.base.result' <<<"$NEEDS")" != success ]; then MAY_SKIP=""; fi
          bad=0
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            case "$result" in
              success) ;;
              skipped) case " $MAY_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped but may not be skipped here (base '$BASE')"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done
          exit $bad
