name: asr

# Real-model ASR tests and the PLAN.md phase 2 budget "1 h audio -> text < 3 min on CPU".
# Kept apart from ci.yml (which has no model downloads) so it does not slow down pull requests.

# Manual only (owner decision 2026-10-19): the same bench runs locally with `pwsh scripts/verify-local.ps1 -Asr`.
on:
  workflow_dispatch:
    inputs:
      # Spike #53: run only the word-confidence measurement (Linux) instead of the tests + 1 h bench.
      word_confidence:
        description: "Word-confidence measurement only (spike #53)"
        type: boolean
        default: false
      confidence_clips:
        description: "FLEURS test clips per language (en, uk) for the word-confidence measurement"
        type: string
        default: "150"
      beam_clips:
        description: "Clips per language decoded again with modified beam search / hotwords"
        type: string
        default: "20"

concurrency:
  group: asr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  MURMUR_MODELS_DIR: ${{ github.workspace }}/models
  # PLAN.md: 1 h of audio -> text in < 3 min (180 s) on CPU.
  ASR_BUDGET_SECONDS: "180"

jobs:
  asr:
    name: real-model tests and 1 h bench (${{ matrix.os }})
    if: github.event.inputs.word_confidence != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            exe: Murmur.Transcription
          - os: windows-latest
            rid: win-x64
            exe: Murmur.Transcription.exe
    # bash everywhere (Git Bash on Windows): `bash --noprofile --norc -eo pipefail {0}` so a failing
    # `dotnet publish | tee` fails the step. jq is preinstalled on both runner images.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # See ci.yml: dotnet-version pins the exact prerelease SDK, the next step verifies it.
      # When global.json changes, update dotnet-version here and in ci.yml.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 11.0.100-rc.3.26522.148

      - name: Verify SDK matches global.json
        run: test "$(dotnet --version | tr -d '\r')" = "$(jq -r .sdk.version global.json | tr -d '\r')"

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Models (~0.7 GB) are cached; bump the "v1" suffix when scripts/fetch-models.* changes the model set.
      # Restore and save are split so the cache is saved right after a successful fetch, even when the
      # tests or the budget gate fail later (a combined actions/cache saves only when the job succeeds).
      - name: Restore ASR models cache
        id: models-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MURMUR_MODELS_DIR }}
          key: models-${{ runner.os }}-parakeet-tdt-0.6b-v3-int8-silero_vad-v1

      - name: Fetch models (Linux)
        if: runner.os == 'Linux'
        run: scripts/fetch-models.sh

      - name: Fetch models (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-models.ps1

      - name: Save ASR models cache
        if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MURMUR_MODELS_DIR }}
          key: models-${{ runner.os }}-parakeet-tdt-0.6b-v3-int8-silero_vad-v1

      - name: Show models
        run: find "$MURMUR_MODELS_DIR" -maxdepth 3 -type f -printf '%s %p\n' 2>/dev/null || ls -lR "$MURMUR_MODELS_DIR"

      - name: Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # The real-model tests skip themselves when MURMUR_MODELS_DIR has no models; here the models are
      # present, so they run. Microsoft.Testing.Platform: a single project is selected with --project.
      - name: Test (Murmur.Transcription.Tests, real models)
        run: dotnet test --project tests/Murmur.Transcription.Tests -c Release --report-xunit-trx --results-directory artifacts/test-results

      - name: Test (Murmur.Core.Tests, real models)
        run: dotnet test --project tests/Murmur.Core.Tests -c Release --report-xunit-trx --results-directory artifacts/test-results

      - name: Publish Native AOT (Murmur.Transcription, ${{ matrix.rid }})
        run: |
          mkdir -p artifacts/logs
          dotnet publish src/Murmur.Transcription -c Release -r ${{ matrix.rid }} -o artifacts/publish/${{ matrix.rid }} 2>&1 | tee artifacts/logs/publish-transcription.log

      - name: Fail on publish warnings
        run: |
          if grep -nE ': (warning|error) ' artifacts/logs/publish-transcription.log; then
            echo "::error::Native AOT publish produced warnings or errors (see above)"
            exit 1
          fi
          echo "No publish warnings."

      # 4 test clips (en, de, es, fr) are looped by the worker up to 3600 s of audio.
      - name: Bench (1 h audio -> text)
        run: |
          mkdir -p artifacts/perf
          parakeet="$MURMUR_MODELS_DIR/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"
          wavs="$parakeet/test_wavs/en.wav,$parakeet/test_wavs/de.wav,$parakeet/test_wavs/es.wav,$parakeet/test_wavs/fr.wav"
          artifacts/publish/${{ matrix.rid }}/${{ matrix.exe }} --bench \
            --model-dir "$parakeet" \
            --vad "$MURMUR_MODELS_DIR/silero_vad.onnx" \
            --wav "$wavs" \
            --seconds 3600 \
            --out artifacts/perf/asr-bench.json

      # The script prints the table first, then exits 1 (pipefail fails the step) when transcribe time exceeds the budget or the bench audio was shorter than 1 h.
      - name: Bench summary and budget gate
        run: |
          scripts/asr-bench-summary.sh artifacts/perf/asr-bench.json "$ASR_BUDGET_SECONDS" "${{ matrix.os }}" | tee artifacts/perf/asr-bench.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asr-bench-${{ matrix.rid }}
          path: artifacts/perf
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asr-test-results-${{ matrix.rid }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

  # Spike #53: per-word confidence (sherpa-onnx ys_log_probs) on FLEURS en/uk clips with known transcripts,
  # plus the cost of modified beam search and hotwords. Report: docs/REPORTS/spike-53-word-confidence.md.
  word-confidence:
    name: word-confidence measurement (spike #53)
    if: github.event.inputs.word_confidence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PARAKEET: ${{ github.workspace }}/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 11.0.100-rc.3.26522.148

      - name: Verify SDK matches global.json
        run: test "$(dotnet --version | tr -d '\r')" = "$(jq -r .sdk.version global.json | tr -d '\r')"

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore ASR models cache
        id: models-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MURMUR_MODELS_DIR }}
          key: models-${{ runner.os }}-parakeet-tdt-0.6b-v3-int8-silero_vad-v1

      - name: Fetch models
        run: scripts/fetch-models.sh

      - name: Save ASR models cache
        if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MURMUR_MODELS_DIR }}
          key: models-${{ runner.os }}-parakeet-tdt-0.6b-v3-int8-silero_vad-v1

      - name: Show models
        run: find "$MURMUR_MODELS_DIR" -maxdepth 3 -type f -printf '%s %p\n'

      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Includes the real-model checks of ys_log_probs and of beam search + hotwords.
      - name: Test (Murmur.Transcription.Tests, real models)
        run: dotnet test --project tests/Murmur.Transcription.Tests -c Release --report-xunit-trx --results-directory artifacts/test-results

      - name: Publish Native AOT (Murmur.Transcription, linux-x64)
        run: |
          mkdir -p artifacts/logs
          dotnet publish src/Murmur.Transcription -c Release -r linux-x64 -o artifacts/publish/linux-x64 2>&1 | tee artifacts/logs/publish-transcription.log
          if grep -nE ': (warning|error) ' artifacts/logs/publish-transcription.log; then
            echo "::error::Native AOT publish produced warnings or errors (see above)"
            exit 1
          fi

      # Inputs reach the shell through env, never through ${{ }} inside run (no script injection); the
      # worker's own parser rejects anything that is not a non-negative integer.
      - name: Prepare clips (FLEURS en_us + uk_ua test)
        env:
          CONFIDENCE_CLIPS: ${{ github.event.inputs.confidence_clips || '150' }}
        run: scripts/word-confidence-clips.sh artifacts/confidence/clips "$CONFIDENCE_CLIPS"

      # Hotwords need a SentencePiece vocabulary. The sherpa-onnx archive may not ship bpe.vocab; derive it from
      # tokens.txt (SentencePiece BPE scores are the negated merge order = token id order).
      - name: BPE vocabulary for hotwords
        run: |
          if [ -f "$PARAKEET/bpe.vocab" ]; then
            cp "$PARAKEET/bpe.vocab" artifacts/confidence/bpe.vocab
            echo "using the model's bpe.vocab"
          else
            awk '$1 != "<blk>" { printf "%s\t%d\n", $1, -$2 }' "$PARAKEET/tokens.txt" > artifacts/confidence/bpe.vocab
            echo "derived bpe.vocab from tokens.txt"
          fi
          head -5 artifacts/confidence/bpe.vocab

      - name: Measure word confidence
        env:
          BEAM_CLIPS: ${{ github.event.inputs.beam_clips || '20' }}
        run: |
          artifacts/publish/linux-x64/Murmur.Transcription --confidence-eval artifacts/confidence/clips/clips.tsv \
            --model-dir "$PARAKEET" \
            --threads "$(nproc)" \
            --beam-clips "$BEAM_CLIPS" \
            --max-active-paths 4 \
            --bpe-vocab artifacts/confidence/bpe.vocab \
            --out artifacts/confidence/word-confidence.json > /dev/null
          cat artifacts/confidence/word-confidence.md >> "$GITHUB_STEP_SUMMARY"
          # Also in the log: artifacts and step summaries are not readable from every environment.
          cat artifacts/confidence/word-confidence.md

      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-confidence
          path: |
            artifacts/confidence/word-confidence.json
            artifacts/confidence/word-confidence.md
            artifacts/confidence/clips/clips.tsv
            artifacts/confidence/bpe.vocab
            artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
